[package]
name = "fsspec_kafka_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fsspec_kafka"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
fsspec_data = "0.4.0"
fsspec_kafka = { path = "./rust", version = "*" }
fsspec_rs = "0.1.5"
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[profile.release]
panic = 'abort'
lto = true
