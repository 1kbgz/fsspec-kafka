[package]
name = "fsspec_kafka_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fsspec_kafka"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "60.1.0", default-features = false, features = ["ipc"] }
fsspec_data = "0.6.0"
fsspec_kafka = { path = "./rust", version = "*" }
fsspec_rs = "0.2.1"
fsspec_sys = { version = "0.2.1", optional = true }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[features]
default = ["capi"]
# Register in the shared libfsspec; `direct` keeps a registry inside this extension (Pyodide).
capi = ["dep:fsspec_sys"]
direct = []

[profile.release]
panic = 'abort'
lto = true
