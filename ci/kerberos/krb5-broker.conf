[libdefaults]
    default_realm = FSSPEC.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false
    qualify_shortname = ""
    udp_preference_limit = 1

[realms]
    FSSPEC.TEST = {
        kdc = kdc:88
    }

[domain_realm]
    localhost = FSSPEC.TEST
