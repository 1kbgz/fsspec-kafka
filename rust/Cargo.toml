[package]
name = "fsspec_kafka"
version = "0.1.0"
authors = ["the fsspec-kafka authors <dev@1kbgz.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/1kbgz/fsspec-kafka"
description = "Kafka topics and partitions through fsspec"

[lib]
name = "fsspec_kafka"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
arrow = { version = "60.1.0", features = ["chrono-tz"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
fsspec_data = "0.6.0"
fsspec_rs = "0.2.0"
futures-executor = "0.3"
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "curl-static", "ssl-vendored", "gssapi-vendored", "zstd", "libz", "naive-runtime"] }

# librdkafka's CMake build always compiles OAUTHBEARER OIDC, which needs curl.
# librdkafka always builds Windows SSPI GSSAPI; Cyrus SASL is not used there.
[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "curl-static", "ssl-vendored", "zstd", "libz", "naive-runtime"] }

[dev-dependencies]
bytes = "1"
parquet = "60.1.0"
