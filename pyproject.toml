[build-system]
requires = [
    "hatchling",
    "hatch-rs>=0.6.0",
    "fsspec-rs>=0.2.1,<0.3",
]
build-backend = "hatchling.build"

[project]
name = "fsspec-kafka"
authors = [
    {name = "the fsspec-kafka authors", email = "dev@1kbgz.com"},
]
description = "Kafka topics and partitions through fsspec"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.2.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "fsspec",
    "fsspec-rs>=0.2.1,<0.3",
]

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "cibuildwheel",
    "codespell",
    "fsspec-data>=0.4.0",
    "hatch-rs",
    "hatchling",
    "mdformat",
    "mdformat-myst",
    "mdformat-tables>=1",
    "pandas",
    "pyarrow",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
]

[project.entry-points."fsspec.specs"]
kafka = "fsspec_kafka.filesystem:KafkaFileSystem"

[project.scripts]

[project.urls]
Repository = "https://github.com/1kbgz/fsspec-kafka"
Homepage = "https://github.com/1kbgz/fsspec-kafka"

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
commit_args = "-s"
pre_commit_hooks = [
    "cargo update --workspace",
    "cargo update --manifest-path rust/Cargo.toml --workspace",
    "git add Cargo.lock rust/Cargo.lock",
]

[[tool.bumpversion.files]]
filename = "fsspec_kafka/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.cibuildwheel]
build = "cp311-*"
test-command = "pytest -vvv {project}/fsspec_kafka/tests"
test-extras = "develop"

[tool.cibuildwheel.linux]
# Vendored OpenSSL, Cyrus SASL, and krb5 builds need perl and yacc.
before-all = """
yum install -y perl-core perl-IPC-Cmd bison
curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain=stable --profile=minimal -y
rustup target add aarch64-unknown-linux-gnu
rustup target add x86_64-unknown-linux-gnu
rustup show
"""
before-build = "cargo clean --manifest-path {package}/Cargo.toml && rm -f {package}/fsspec_kafka/*.so"
environment = {PATH="$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR="always"}
skip = "*i686* *musllinux*"
# libfsspec comes from the fsspec_rs package the extension's rpath points at.
repair-wheel-command = "auditwheel repair --exclude 'libfsspec.so*' -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = {PATH="$HOME/.cargo/bin:$PATH", CARGO_TERM_COLOR="always", MACOS_DEPLOYMENT_TARGET=11.0}
archs = "arm64"
repair-wheel-command = "bash {project}/scripts/repair-macos-wheel.sh {delocate_archs} {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
environment = {PATH="$UserProfile\\.cargo\bin;$PATH", CARGO_TERM_COLOR="always"}
skip = "*win32 *arm64"
repair-wheel-command = "delvewheel repair --exclude fsspec.dll -w {dest_dir} {wheel}"


[tool.coverage.run]
branch = true
omit = [
    "fsspec_kafka/tests/integration/*",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.hooks.hatch-rs]
verbose = true
abi3 = true
module = "fsspec_kafka"
path = "."

# libfsspec from the installed fsspec_rs package; the extension registers its protocols there.
[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "fsspec"
python-package = "fsspec_rs"

[[tool.hatch.build.hooks.hatch-rs.artifacts]]
name = "fsspec_kafka"
manifest = "Cargo.toml"
destination = "fsspec_kafka/{python_extension_name}"
links = ["fsspec"]

[tool.hatch.build.hooks.hatch-rs.artifacts.library-source-features]
bundled = ["capi"]
external = ["capi"]
static = ["direct"]
direct = ["direct"]

[tool.hatch.build.targets.sdist]
packages = [
    "fsspec_kafka",
    "rust",
    "Cargo.toml",
    "Cargo.lock",
]
exclude = [
    "*.dll",
    "*.dylib",
    "*.so",
    "*.pyd",
    "rust/Makefile",
    "target",
]

[tool.hatch.build.targets.wheel]
artifacts = [
    "fsspec_kafka/*.dll",
    "fsspec_kafka/*.dylib",
    "fsspec_kafka/*.so",
]
packages = [
    "fsspec_kafka",
]
exclude = [
    "rust",
]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "fsspec_kafka/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "fsspec_kafka",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "fsspec-kafka"
root = "README.md"
pages = []
use-autoapi = true

